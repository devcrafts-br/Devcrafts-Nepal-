<style>
:root{--bg:#10141a;--bg2:#161c25;--line:#26303d;--text:#e9eef5;--muted:#9aa8ba;--blue:#3b82f6;--teal:#2dd4bf;--grad:linear-gradient(120deg,#3b82f6,#2dd4bf);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.65 "DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",sans-serif;line-height:1.08;margin:0;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
section{padding:96px 0}
h2{font-size:clamp(30px,4.6vw,48px);font-weight:800;max-width:17ch}
.lead{color:var(--muted);max-width:56ch;margin:16px 0 0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:55;background:rgba(16,20,26,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(16,20,26,.95);z-index:30}
nav{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:10px;font:800 21px "Bricolage Grotesque",sans-serif}
.brand img{height:34px;width:auto;mix-blend-mode:screen}
.brand b{font-weight:500;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:10px;font-weight:700;font-size:16px;border:1px solid transparent;cursor:pointer;font-family:inherit;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--grad);color:#06121f}
.btn.g{border-color:var(--line);color:var(--text)}
.btn.g:hover{border-color:var(--teal)}
.right{display:flex;align-items:center;gap:12px}
.menu{position:relative;width:46px;height:46px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);cursor:pointer;color:var(--text);z-index:60}
.menu span{position:absolute;left:12px;right:12px;height:2px;background:currentColor;border-radius:2px;transition:transform .3s,opacity .2s,top .3s}
.menu span:nth-child(1){top:15px}.menu span:nth-child(2){top:22px}.menu span:nth-child(3){top:29px}
.menu[aria-expanded=true] span:nth-child(1){top:22px;transform:rotate(45deg)}
.menu[aria-expanded=true] span:nth-child(2){opacity:0}
.menu[aria-expanded=true] span:nth-child(3){top:22px;transform:rotate(-45deg)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,13,18,.97);backdrop-filter:blur(16px);padding:calc(96px + env(safe-area-inset-top,0px)) 22px 40px;overflow:auto;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.ov.open{opacity:1;visibility:visible}
.ov .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:48px}
.ov nav{display:grid;gap:4px;height:auto}
.ov nav a{font:800 clamp(30px,6vw,52px)/1.2 "Bricolage Grotesque",sans-serif;color:var(--text);padding:4px 0;transition:transform .2s,color .2s}
.ov nav a:hover{color:var(--teal);transform:translateX(8px)}
.oc{display:grid;gap:12px;align-content:start;font-size:16px}
.oc small{color:var(--muted);display:block}
.oc a{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--bg2)}
.oc a:hover{border-color:var(--teal)}
.hero{position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(90px);opacity:.28;pointer-events:none}
.hero::before{width:420px;height:420px;background:#3b82f6;top:-140px;left:-120px}
.hero::after{width:360px;height:360px;background:#2dd4bf;bottom:-160px;right:-100px}
.hero .wrap{position:relative;z-index:1}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:36px}
.chips span{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:10px 18px;font-size:15.5px}
.chips span:hover{border-color:var(--teal)}
.faq{margin-top:40px;max-width:780px;display:grid;gap:12px}
.faq details{border:1px solid var(--line);border-radius:12px;background:var(--bg2);padding:4px 20px}
.faq summary{cursor:pointer;list-style:none;font:700 18px "Bricolage Grotesque";padding:14px 0;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--teal);font-size:24px;line-height:1}
.faq details[open] summary::after{content:"\2212"}
.faq p{margin:0 0 16px;color:var(--muted);font-size:16px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero{padding:72px 0 88px}
.hgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
h1{font-size:clamp(40px,6.6vw,74px);font-weight:800}
h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:19px;max-width:48ch;margin:22px 0 30px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.note{margin-top:22px;font-size:15px;color:var(--muted)}
.note i{font-style:normal;color:var(--teal)}
.win{background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px -30px rgba(59,130,246,.35)}
.bar{display:flex;gap:7px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.bar i{width:10px;height:10px;border-radius:50%;background:#3a4656}
.bar em{font-style:normal;margin-left:10px;font-size:13px;color:var(--muted);background:var(--bg);border-radius:6px;padding:3px 12px;flex:1}
pre{margin:0;padding:20px;font:13.5px/1.75 ui-monospace,Menlo,Consolas,monospace;color:#b8c6d8;min-height:250px;white-space:pre-wrap}
.t{color:#60a5fa}.a{color:#2dd4bf}.s{color:#f0abfc}
.cur{display:inline-block;width:8px;height:15px;background:var(--teal);vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.prev{margin:0 20px 20px;border:1px solid var(--line);border-radius:10px;padding:16px;background:linear-gradient(135deg,rgba(59,130,246,.18),rgba(45,212,191,.12))}
.prev b{display:block;font:700 15px "Bricolage Grotesque";margin-bottom:4px}
.prev span{font-size:13px;color:var(--muted)}
.strip{border-block:1px solid var(--line);background:var(--bg2)}
.strip .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding-block:26px}
.strip div{font-size:15px;color:var(--muted)}
.strip strong{display:block;color:var(--text);font:700 18px "Bricolage Grotesque"}
.sv{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:44px}
.sv article{background:var(--bg);padding:30px 26px}
.sv h3{font-size:22px;font-weight:700;margin-bottom:10px}
.sv p{margin:0;color:var(--muted);font-size:16px}
.sv article:hover{background:var(--bg2)}
.proc{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:44px;counter-reset:s}
.proc li{list-style:none;border-top:2px solid var(--line);padding-top:18px;counter-increment:s}
.proc li::before{content:counter(s);font:800 34px "Bricolage Grotesque";background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.proc h3{font-size:20px;margin:6px 0}
.proc p{margin:0;color:var(--muted);font-size:15.5px}
.proc{padding:0}
.why{background:var(--bg2);border-block:1px solid var(--line)}
.wg{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.wg ul{margin:0;padding:0;list-style:none;display:grid;gap:18px}
.wg li{display:grid;grid-template-columns:28px 1fr;gap:12px}
.wg li svg{margin-top:4px}
.wg strong{display:block;font:700 19px "Bricolage Grotesque"}
.wg li span{color:var(--muted);font-size:15.5px}
.offer{margin-top:30px;border:1px solid var(--line);border-radius:14px;padding:22px;background:var(--bg)}
.offer h3{font-size:20px;margin-bottom:6px}
.offer p{margin:0;color:var(--muted);font-size:15.5px}
.cg{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;margin-top:10px}
.ci{display:grid;gap:14px;margin-top:30px}
.ci a,.ci div{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--bg2)}
.ci a:hover{border-color:var(--teal)}
.ci small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.ci b{font-weight:500}
form{display:grid;gap:14px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:26px}
label{font-size:14px;color:var(--muted);display:grid;gap:6px}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
textarea{min-height:110px;resize:vertical}
.fine{font-size:13.5px;color:var(--muted);margin:0}
footer{border-top:1px solid var(--line);padding:46px 0 60px}
.fg{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;align-items:center}
.fg img{width:220px;max-width:100%;mix-blend-mode:screen}
.soc{display:flex;gap:12px}
.soc a{border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:15px}
.soc a:hover{border-color:var(--teal)}
.copy{margin-top:30px;color:var(--muted);font-size:14px}
.wa{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;background:#25d366;color:#06240f;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.45)}
@media(max-width:900px){
section{padding:68px 0}
.hgrid,.wg,.cg{grid-template-columns:1fr}
.sv{grid-template-columns:1fr}.proc{grid-template-columns:1fr 1fr}.strip .wrap{grid-template-columns:1fr 1fr}
.ov .wrap{grid-template-columns:1fr}
.right .btn{display:none}
}
@media(max-width:520px){.proc{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.cur{animation:none}html{scroll-behavior:auto}}
